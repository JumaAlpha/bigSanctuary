<html>

    <script>
      const path = location.pathname;
      if (path.startsWith('/bigSanctuary')) {
        sessionStorage.redirect = path.replace('/bigSanctuary', '');
      }
      location.href = '/bigSanctuary/';
    </script>
  </head>
  <body>
    <p>...Redirecting to the homepage...</p>
  </body>
</html>
